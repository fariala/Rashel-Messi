<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | SAS Wedding Studio</title>
    <meta name="description" content="Manage your wedding invitation, guest list, QR passes and RSVPs from the SAS Wedding Studio dashboard." data-i18n-content="Manage your wedding invitation, guest list, QR passes and RSVPs from the SAS Wedding Studio dashboard.">
    <meta name="theme-color" content="#2c2530">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/images/icon-192x192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Josefin+Sans:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/all.min.css" integrity="sha256-4rTIfo5GQTi/7UJqoyUJQKzxW8VN/YBH31+Cy+vTZj4=" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/saas.css">
    <link rel="stylesheet" href="./css/saas-admin.css">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha256-5P1JGBOIxI7FBAvT/mb1fCnI5n/NhQKzNUuW7Hq0fMc=" crossorigin="anonymous"></script>
    <script defer src="./dist/saas-admin.js"></script>
</head>

<body class="sas-body">
    <div class="sas-shell" id="sas-shell">
        <div class="sas-drawer-scrim" data-drawer-close></div>

        <aside class="sas-sidebar" aria-label="Main navigation" data-i18n-aria-label="Main navigation">
            <a class="sas-brand" href="/admin.html">
                <span class="sas-brand-mark">SAS</span>
                <span class="sas-brand-text">
                    <span class="sas-brand-name" id="brand-name">SAS Wedding Studio</span>
                    <span class="sas-brand-sub" data-i18n="Invitation suite">Invitation suite</span>
                </span>
            </a>

            <p class="sas-nav-label">Studio</p>
            <ul class="sas-nav">
                <li><button type="button" class="sas-nav-btn is-active" data-view="overview"><i class="fa-solid fa-chart-pie"></i><span data-i18n="Dashboard">Dashboard</span></button></li>
                <li><button type="button" class="sas-nav-btn" data-view="guests"><i class="fa-solid fa-user-group"></i><span data-i18n="Guests">Guests</span><span class="sas-nav-count" id="nav-guest-count">0</span></button></li>
                <li><button type="button" class="sas-nav-btn" data-view="cms"><i class="fa-solid fa-pen-nib"></i><span data-i18n="Invitation CMS">Invitation CMS</span></button></li>
                <li><button type="button" class="sas-nav-btn" data-view="rsvp"><i class="fa-solid fa-envelope-open-text"></i><span data-i18n="RSVPs">RSVPs</span><span class="sas-nav-count" id="nav-rsvp-count">0</span></button></li>
                <li><button type="button" class="sas-nav-btn" data-view="checkin"><i class="fa-solid fa-qrcode"></i><span data-i18n="QR check-in">QR check-in</span></button></li>
            </ul>

            <p class="sas-nav-label" data-i18n="Account">Account</p>
            <ul class="sas-nav">
                <li><button type="button" class="sas-nav-btn" data-view="settings"><i class="fa-solid fa-gear"></i><span data-i18n="Settings">Settings</span></button></li>
            </ul>

            <div class="sas-sidebar-card">
                <h6 data-i18n="Live invitation">Live invitation</h6>
                <p><span data-i18n="Status:">Status:</span> <span id="sidebar-publish-state" data-i18n="published">published</span></p>
                <a class="sas-btn" id="sidebar-invite-link" href="/invite.html" target="_blank" rel="noopener">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> <span data-i18n="View invitation">View invitation</span>
                </a>
            </div>

            <div class="sas-sidebar-foot">
                <span class="sas-avatar" id="sidebar-avatar">S</span>
                <span class="sas-sidebar-user">
                    <strong id="sidebar-name" data-i18n="Loading...">Loading...</strong>
                    <span id="sidebar-email">-</span>
                </span>
                <button type="button" class="sas-sidebar-logout" id="logout-button" aria-label="Sign out" data-i18n-aria-label="Sign out">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <div class="sas-main">
            <header class="sas-topbar">
                <button type="button" class="sas-menu-btn" id="menu-toggle" aria-label="Open navigation" data-i18n-aria-label="Open navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="sas-topbar-title">
                    <h1 id="page-title" data-i18n="Dashboard">Dashboard</h1>
                    <p id="page-subtitle" data-i18n="Overview of your invitation">Overview of your invitation</p>
                </div>
                <div class="sas-topbar-actions">
                    <span class="sas-view-badge" id="publish-badge"><i class="fa-solid fa-circle-check"></i> <span data-i18n="Published">Published</span></span>
                    <a class="sas-btn sas-btn-outline sas-btn-sm sas-topbar-invite" href="/invite.html" target="_blank" rel="noopener">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> <span data-i18n="View invitation">View invitation</span>
                    </a>
                    <select class="language-switch" data-language-select aria-label="Language" data-i18n-aria-label="Language">
                        <option value="en" lang="en">English</option>
                        <option value="fr" lang="fr">Français</option>
                    </select>
                    <span class="sas-topbar-user">
                        <span class="sas-avatar" id="topbar-avatar" style="width:2rem;height:2rem;font-size:0.8rem">S</span>
                        <span id="topbar-name">Rashel</span>
                    </span>
                </div>
            </header>

            <main class="sas-content" id="view-root" tabindex="-1">
                <div class="sas-card">
                    <div class="sas-skeleton" style="height:1.2rem;width:40%;margin-bottom:1rem"></div>
                    <div class="sas-skeleton" style="height:0.8rem;width:70%;margin-bottom:0.6rem"></div>
                    <div class="sas-skeleton" style="height:0.8rem;width:55%"></div>
                </div>
            </main>
        </div>

    </div>
</body>

</html>
