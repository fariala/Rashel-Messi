<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Botanical wedding backdrop">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#241d29"/>
            <stop offset="0.52" stop-color="#4b3545"/>
            <stop offset="1" stop-color="#96606b"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f2d5a8" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#f2d5a8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="rose" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#e9b7bd" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#e9b7bd" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="46"/>
        </filter>
        <symbol id="leaf" viewBox="-30 -14 60 28">
            <path d="M-29 0C-14-15 12-17 29 0 12 17-14 15-29 0Z" fill="currentColor"/>
        </symbol>
        <symbol id="bud" viewBox="-16 -16 32 32">
            <circle cx="0" cy="0" r="7" fill="currentColor" opacity="0.9"/>
            <circle cx="0" cy="0" r="13" fill="currentColor" opacity="0.25"/>
        </symbol>
    </defs>

    <rect width="1920" height="1200" fill="url(#sky)"/>
    <circle cx="1510" cy="230" r="430" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="280" cy="1020" r="380" fill="url(#rose)" filter="url(#soft)"/>
    <circle cx="960" cy="640" r="300" fill="url(#glow)" opacity="0.35" filter="url(#soft)"/>

    <g fill="none" stroke="#d9bd8c" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
        <path d="M-40 1210C170 1010 270 850 360 650 400 560 430 470 500 400"/>
        <path d="M-20 1180C120 1040 210 930 300 800"/>
        <path d="M1880 1210C1690 1030 1610 880 1530 690 1500 610 1470 520 1400 450"/>
        <path d="M1940 1150C1810 1010 1720 900 1640 760"/>
        <path d="M120 180C260 260 360 340 470 470"/>
        <path d="M1810 160C1670 250 1580 340 1490 470"/>
    </g>

    <g color="#d9bd8c">
        <use href="#leaf" x="-60" y="1060" width="90" height="42" transform="rotate(-42 -60 1060)" opacity="0.16"/>
        <use href="#leaf" x="80" y="940" width="110" height="50" transform="rotate(-30 80 940)" opacity="0.2"/>
        <use href="#leaf" x="190" y="820" width="96" height="44" transform="rotate(-52 190 820)" opacity="0.14"/>
        <use href="#leaf" x="280" y="720" width="120" height="54" transform="rotate(-38 280 720)" opacity="0.18"/>
        <use href="#leaf" x="352" y="600" width="88" height="40" transform="rotate(-62 352 600)" opacity="0.14"/>

        <use href="#leaf" x="1610" y="950" width="100" height="46" transform="rotate(26 1610 950)" opacity="0.16"/>
        <use href="#leaf" x="1710" y="820" width="124" height="56" transform="rotate(38 1710 820)" opacity="0.2"/>
        <use href="#leaf" x="1590" y="700" width="92" height="42" transform="rotate(18 1590 700)" opacity="0.14"/>
        <use href="#leaf" x="1690" y="580" width="108" height="48" transform="rotate(30 1690 580)" opacity="0.16"/>

        <use href="#bud" x="150" y="1010" width="34" height="34" opacity="0.3"/>
        <use href="#bud" x="300" y="840" width="26" height="26" opacity="0.28"/>
        <use href="#bud" x="404" y="690" width="30" height="30" opacity="0.3"/>
        <use href="#bud" x="1600" y="880" width="34" height="34" opacity="0.28"/>
        <use href="#bud" x="1740" y="700" width="28" height="28" opacity="0.3"/>
    </g>

    <g fill="none" stroke="#f3e3c6" stroke-width="1.4" opacity="0.32">
        <circle cx="960" cy="600" r="286"/>
        <circle cx="960" cy="600" r="300"/>
        <path d="M660 600h-70M1290 600h70"/>
    </g>
</svg>
