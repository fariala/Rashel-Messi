# SAS Wedding Studio - Nginx site (HTTP first)
#
# 1. Replace invitations.example.com with your domain.
# 2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/sas-wedding
# 3. sudo ln -s /etc/nginx/sites-available/sas-wedding /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. sudo certbot --nginx -d invitations.example.com
#    Certbot adds the TLS server block and the HTTP -> HTTPS redirect.
#
# If Cloudflare is in front of this server, use SSL/TLS mode "Full (strict)".

server {
    listen 80;
    listen [::]:80;
    server_name invitations.example.com;

    # Uploads are capped at 4 MB in the app; leave headroom for request framing.
    client_max_body_size 10m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
